<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Time Search</title>
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
    <main class="app">
        <h1>GPX Time Search</h1>

        <label for="gpxFile">GPX files</label>
        <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml" multiple>
        <ul id="fileList" aria-label="Loaded GPX files"></ul>
        <p id="status" role="status"></p>

        <label for="timeInput">Time</label>
        <input
            type="text"
            id="timeInput"
            size="30"
            placeholder="2008-07-12T10:25:30Z">

        <div class="actions" aria-label="Point navigation">
            <button type="button" id="previousPoint">Previous Point</button>
            <button type="button" id="nextPoint">Next Point</button>
            <button type="button" id="nextDate">Next Date</button>
        </div>

        <div class="actions">
            <button type="button" id="showCoordinate">Show Coordinate</button>
            <button type="button" id="showGoogleMap">Show on Google Map</button>
        </div>

        <div id="result" aria-live="polite"></div>
    </main>

    <script src="./node_modules/gpxparser/dist/GPXParser.min.js"></script>
    <script>window.GPXParser = gpxParser;</script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
